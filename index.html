<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HoloFlix</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<nav>
  <div class="logo">
    <span class="holo">HOLO</span><span class="flix">FLIX</span>
  </div>

  <div style="position:relative; display:flex; gap:5px;">
    <input id="search" placeholder="Search movies..." />
    <button id="searchBtn">Search</button>
    <div id="suggestions"></div>
  </div>

  <select id="genreFilter">
    <option value="">Genres</option>
  </select>

  <select id="sortFilter">
    <option value="popular">Popular</option>
    <option value="top_rated">Top Rated</option>
    <option value="now_playing">Now Playing</option>
  </select>

  <button data-view="home">Home</button>
  <button data-view="movies">Movies</button>
  <button data-view="favorites">Favorites</button>
</nav>

<div id="app">

  <div id="home-view" class="view active">
    <h1>Trending Movies</h1>
    <div id="home-grid"></div>
  </div>

  <div id="movies-view" class="view">
    <h1>Movies</h1>
    <div id="movies-grid"></div>

    <div id="pagination">
      <button id="prev">Prev</button>
      <span id="page">1</span>
      <button id="next">Next</button>
    </div>
  </div>

  <div id="detail-view" class="view">
    <button id="back">← Back</button>

    <div class="detail-box">
      <img id="detail-img" />
      <h1 id="detail-title"></h1>
      <p id="detail-overview"></p>
      <p id="detail-actors"></p>

      <button id="favBtn">❤️ Favorite</button>
    </div>
  </div>

  <div id="favorites-view" class="view">
    <h1>Favorites</h1>
    <div id="fav-grid"></div>
  </div>

</div>

<script>

const API_KEY = "ec49f2d5bd16d2cf6f6a55185e08503c";
const BASE = "https://api.themoviedb.org/3";
const IMG = "https://image.tmdb.org/t/p/w500";

// ---------------- STATE ----------------
let currentMovie = null;
let page = 1;
let currentGenre = "";
let currentSort = "popular";
let searchQuery = "";
let historyStack = ["home"];

// ---------------- VIEW ----------------
function show(view, push=true){
  $(".view").removeClass("active");
  $(`#${view}-view`).addClass("active");

  if(push){
    let last = historyStack[historyStack.length - 1];
    if(last !== view){
      historyStack.push(view);
    }
  }
}

// ---------------- BACK ----------------
function goBack(){
  if(historyStack.length > 1){
    historyStack.pop();
  }

  let view = historyStack[historyStack.length - 1];

  $(".view").removeClass("active");
  $(`#${view}-view`).addClass("active");

  if(view === "home") loadHome();
  if(view === "movies") loadMovies();
  if(view === "favorites") loadFavs();
}

// ---------------- API ----------------
function api(url){
  return $.ajax({
    url: BASE + url,
    data: { api_key: API_KEY }
  });
}

// ---------------- GENRES (FIXED) ----------------
function loadGenres(){
  api("/genre/movie/list").then(d=>{
    let genres = d.genres || [];

    $("#genreFilter").html(`
      <option value="">Genres</option>
      ${genres.map(g=>`
        <option value="${g.id}">${g.name}</option>
      `).join("")}
    `);
  });
}

// ---------------- FILTER ENGINE ----------------
function applyFilters(list){
  if(currentGenre){
    list = list.filter(m =>
      m.genre_ids?.includes(Number(currentGenre))
    );
  }
  return list;
}

// ---------------- RENDER ----------------
function render(list){
  return (list || []).map(m=>{
    const img = m.poster_path
      ? IMG + m.poster_path
      : "https://via.placeholder.com/300x450?text=No+Image";

    return `
      <div class="card" data-id="${m.id}">
        <img src="${img}">
        <p>${m.title}</p>
      </div>
    `;
  }).join("");
}

// ---------------- HOME ----------------
function loadHome(){
  api("/trending/movie/day").then(d=>{
    $("#home-grid").html(render(applyFilters(d.results || [])));
  });
}

// ---------------- MOVIES ----------------
function loadMovies(){
  $("#movies-grid").html("Loading...");

  let url = searchQuery
    ? `/search/movie?query=${searchQuery}&page=${page}`
    : `/movie/${currentSort}?page=${page}`;

  api(url).then(d=>{
    $("#movies-grid").html(render(applyFilters(d.results || [])));
    $("#page").text(page);
  });
}

// ---------------- FAVORITES ----------------
function loadFavs(){
  let favs = JSON.parse(localStorage.getItem("favs") || "[]");
  $("#fav-grid").html(render(applyFilters(favs)));
}

// ---------------- DETAIL ----------------
function loadDetail(movie){
  currentMovie = movie;

  show("detail");

  $("#detail-img").attr(
    "src",
    movie.poster_path ? IMG + movie.poster_path : ""
  );

  $("#detail-title").text(movie.title);
  $("#detail-overview").text(movie.overview);

  api(`/movie/${movie.id}/credits`).then(c=>{
    $("#detail-actors").text(
      "Actors: " +
      (c.cast || []).slice(0,5).map(a=>a.name).join(", ")
    );
  });
}

// ---------------- CLICK MOVIE ----------------
$(document).on("click",".card",function(){
  let id = $(this).data("id");

  api(`/movie/${id}`).then(m=>{
    loadDetail(m);
  });
});

// ---------------- BACK BUTTON ----------------
$("#back").on("click",function(){
  goBack();
});

// ---------------- FAVORITES ----------------
$("#favBtn").on("click",function(){
  if(!currentMovie) return;

  let favs = JSON.parse(localStorage.getItem("favs") || "[]");

  if(!favs.some(f => f.id === currentMovie.id)){
    favs.push(currentMovie);
  }

  localStorage.setItem("favs", JSON.stringify(favs));
  alert("Added ❤️");
});

// ---------------- NAV ----------------
$(document).on("click","button[data-view]",function(){
  let v = $(this).data("view");
  show(v);

  if(v==="home") loadHome();
  if(v==="movies") loadMovies();
  if(v==="favorites") loadFavs();
});

// ---------------- SEARCH ----------------
$("#searchBtn").on("click",function(){
  searchQuery = $("#search").val().trim();
  page = 1;
  loadMovies();
});

// ---------------- LIVE SEARCH ----------------
$("#search").on("input",function(){
  let q = $(this).val().trim();

  if(q.length < 2){
    $("#suggestions").empty();
    return;
  }

  api(`/search/movie?query=${q}`).then(d=>{
    $("#suggestions").html(
      (d.results || []).slice(0,5).map(m=>`
        <div class="suggestion-item" data-id="${m.id}">
          ${m.title}
        </div>
      `).join("")
    );
  });
});

// ---------------- SUGGESTION CLICK ----------------
$(document).on("click",".suggestion-item",function(){
  let id = $(this).data("id");

  $("#suggestions").empty();
  $("#search").val("");

  api(`/movie/${id}`).then(m=>{
    loadDetail(m);
  });
});

// ---------------- CLOSE SUGGESTIONS ----------------
$(document).on("click",function(e){
  if(!$(e.target).closest("#search,#suggestions").length){
    $("#suggestions").empty();
  }
});

// ---------------- FILTERS (FULLY FIXED) ----------------
$("#genreFilter").on("change",function(){
  currentGenre = $(this).val();

  loadHome();
  loadMovies();
  loadFavs();
});

$("#sortFilter").on("change",function(){
  currentSort = $(this).val();

  loadHome();
  loadMovies();
  loadFavs();
});

// ---------------- PAGINATION ----------------
$("#next").on("click",function(){
  page++;
  loadMovies();
});

$("#prev").on("click",function(){
  if(page > 1){
    page--;
    loadMovies();
  }
});

// ---------------- INIT ----------------
$(function(){
  loadGenres();   // ⭐ FIX: restores genre dropdown
  show("home", false);
  loadHome();
});

</script>

</body>
</html>
