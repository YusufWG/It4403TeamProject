<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HoloFlix</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<nav>
  <div class="logo">
    <span class="holo">HOLO</span><span class="flix">FLIX</span>
  </div>

  <input id="search" placeholder="Search movies..." />

  <button data-view="home">Home</button>
  <button data-view="movies">Movies</button>
  <button data-view="favorites">Favorites</button>
</nav>

<div id="app">

  <div id="home-view" class="view active">
    <h1>Trending Movies</h1>
    <div id="home-grid"></div>
  </div>

  <div id="movies-view" class="view">
    <h1>Movies</h1>
    <div id="movies-grid"></div>
  </div>

  <div id="detail-view" class="view"></div>

  <div id="favorites-view" class="view">
    <h1>Favorites</h1>
    <div id="fav-grid"></div>
  </div>

</div>

<script>

const API_KEY = "ec49f2d5bd16d2cf6f6a55185e08503c";
const BASE = "https://api.themoviedb.org/3";
const IMG = "https://image.tmdb.org/t/p/w500";

let currentMovie = null;
let favs = JSON.parse(localStorage.getItem("favs") || "[]");

// ---------------- VIEW ----------------
function show(view){
  $(".view").removeClass("active");
  $(`#${view}-view`).addClass("active");
}

// ---------------- API ----------------
function api(url){
  return $.get(`${BASE}${url}?api_key=${API_KEY}`)
    .fail(err => console.log("API ERROR", err));
}

// ---------------- RENDER MOVIES ----------------
function render(list){
  return list.map(m => {
    const img = m.poster_path
      ? IMG + m.poster_path
      : "https://via.placeholder.com/300x450?text=No+Image";

    return `
      <div class="card" data-id="${m.id}">
        <img src="${img}">
        <p>${m.title}</p>
      </div>
    `;
  }).join("");
}

// ---------------- HOME ----------------
function loadHome(){
  api("/trending/movie/day").then(d=>{
    $("#home-grid").html(render(d.results));
  });
}

// ---------------- MOVIES ----------------
function loadMovies(){
  $("#movies-grid").html("Loading...");
  api("/discover/movie").then(d=>{
    $("#movies-grid").html(render(d.results));
  });
}

// ---------------- DETAIL VIEW (FULL FIXED) ----------------
function loadDetail(movie){
  const img = movie.poster_path
    ? IMG + movie.poster_path
    : "https://via.placeholder.com/300x450?text=No+Image";

  $("#detail-view").html(`
    <button id="back">← Back</button>

    <div class="detail-box">
      <img src="${img}" class="detail-img">

      <h1>${movie.title}</h1>
      <p>${movie.overview}</p>

      <button id="favBtn">❤️ Add to Favorites</button>
    </div>
  `);

  show("detail");
}

// ---------------- CLICK MOVIE ----------------
$(document).on("click",".card",function(){
  let id = $(this).data("id");

  api(`/movie/${id}`).then(m=>{
    currentMovie = m;
    loadDetail(m);
  });
});

// ---------------- FAVORITE ----------------
$(document).on("click","#favBtn",function(){
  if(!currentMovie) return;

  favs.push(currentMovie);
  localStorage.setItem("favs", JSON.stringify(favs));

  alert("Added to Favorites ❤️");
});

// ---------------- FAVORITES PAGE ----------------
function loadFavs(){
  $("#fav-grid").html(
    favs.map(f => {
      const img = f.poster_path
        ? IMG + f.poster_path
        : "https://via.placeholder.com/300x450?text=No+Image";

      return `
        <div class="card fav-card" data-id="${f.id}">
          <img src="${img}">
          <p>${f.title}</p>
        </div>
      `;
    }).join("")
  );
}

// ---------------- CLICK FAVORITE -> DETAILS ----------------
$(document).on("click",".fav-card",function(){
  let id = $(this).data("id");

  api(`/movie/${id}`).then(m=>{
    currentMovie = m;
    loadDetail(m);
  });
});

// ---------------- NAV ----------------
$(document).on("click","button[data-view]",function(){
  let v = $(this).data("view");
  show(v);

  if(v === "home") loadHome();
  if(v === "movies") loadMovies();
  if(v === "favorites") loadFavs();
});

// ---------------- BACK ----------------
$(document).on("click","#back",function(){
  show("movies");
});

// ---------------- SEARCH ----------------
$("#search").on("keyup",function(){
  let q = $(this).val();
  if(q.length < 2) return;

  api(`/search/movie?query=${q}`).then(d=>{
    $("#movies-grid").html(render(d.results));
  });
});

// ---------------- INIT ----------------
$(function(){
  loadHome();
});

</script>

</body>
</html>
