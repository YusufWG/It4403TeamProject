<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HoloFlix</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<nav>
  <div class="logo">
    <span class="holo">HOLO</span><span class="flix">FLIX</span>
  </div>

  <div style="position:relative; display:flex; gap:5px;">
    <input id="search" placeholder="Search movies..." />
    <button id="searchBtn">Search</button>
    <div id="suggestions"></div>
  </div>

  <select id="genreFilter">
    <option value="">Genres</option>
  </select>

  <select id="sortFilter">
    <option value="popular">Popular</option>
    <option value="top_rated">Top Rated</option>
    <option value="now_playing">Now Playing</option>
  </select>

  <button data-view="home">Home</button>
  <button data-view="movies">Movies</button>
  <button data-view="favorites">Favorites</button>
</nav>

<div id="app">

  <!-- HOME -->
  <div id="home-view" class="view active">
    <h1>Trending Movies</h1>
    <div id="home-grid"></div>
  </div>

  <!-- MOVIES -->
  <div id="movies-view" class="view">
    <h1>Movies</h1>
    <div id="movies-grid"></div>

    <div id="pagination">
      <button id="prev">Prev</button>
      <span id="page">1</span>
      <button id="next">Next</button>
    </div>
  </div>

  <!-- DETAIL -->
  <div id="detail-view" class="view">
    <button id="back">← Back</button>

    <div class="detail-box">
      <img id="detail-img" class="detail-img" />
      <h1 id="detail-title"></h1>
      <p id="detail-overview"></p>
      <p id="detail-actors"></p>

      <button id="favBtn">❤️ Add to Favorites</button>
    </div>
  </div>

  <!-- FAVORITES -->
  <div id="favorites-view" class="view">
    <h1>Favorites</h1>
    <div id="fav-grid"></div>
  </div>

</div>

<script>

const API_KEY = "ec49f2d5bd16d2cf6f6a55185e08503c";
const BASE = "https://api.themoviedb.org/3";
const IMG = "https://image.tmdb.org/t/p/w500";

let currentMovie = null;
let page = 1;
let currentGenre = "";
let currentSort = "popular";
let searchQuery = "";

// ---------------- VIEW ----------------
function show(v){
  $(".view").removeClass("active");
  $(`#${v}-view`).addClass("active");
}

// ---------------- API ----------------
function api(url){
  return $.ajax({
    url: BASE + url,
    data: { api_key: API_KEY }
  });
}

// ---------------- RENDER ----------------
function render(list){
  return (list || []).map(m=>{
    const img = m.poster_path
      ? IMG + m.poster_path
      : "https://via.placeholder.com/300x450?text=No+Image";

    return `
      <div class="card" data-id="${m.id}">
        <img src="${img}">
        <p>${m.title || m.name}</p>
      </div>
    `;
  }).join("");
}

// ---------------- MASTER DATA ENGINE ----------------
function fetchData(callback){
  let url;

  if(searchQuery.length > 0){
    url = `/search/movie?query=${searchQuery}&page=${page}`;
  } else {
    url = `/movie/${currentSort}?page=${page}`;
  }

  api(url).then(d=>{
    let results = d.results || [];

    if(currentGenre){
      results = results.filter(m =>
        m.genre_ids && m.genre_ids.includes(Number(currentGenre))
      );
    }

    callback(results);
  });
}

// ---------------- HOME ----------------
function loadHome(){
  api("/trending/movie/day").then(d=>{
    fetchData(filtered=>{
      $("#home-grid").html(render(filtered));
    });
  });
}

// ---------------- MOVIES ----------------
function loadMovies(){
  $("#movies-grid").html("Loading...");

  fetchData(results=>{
    $("#movies-grid").html(render(results));
    $("#page").text(page);
  });
}

// ---------------- FAVORITES (FILTERED) ----------------
function loadFavs(){
  let favs = JSON.parse(localStorage.getItem("favs") || "[]");

  if(currentGenre){
    favs = favs.filter(m =>
      m.genre_ids && m.genre_ids.includes(Number(currentGenre))
    );
  }

  $("#fav-grid").html(render(favs));
}

// ---------------- DETAIL ----------------
function loadDetail(movie){
  currentMovie = movie;

  const img = movie.poster_path
    ? IMG + movie.poster_path
    : "https://via.placeholder.com/300x450?text=No+Image";

  $("#detail-img").attr("src", img);
  $("#detail-title").text(movie.title);
  $("#detail-overview").text(movie.overview);

  api(`/movie/${movie.id}/credits`).then(c=>{
    let actors = (c.cast || [])
      .slice(0,5)
      .map(a=>a.name)
      .join(", ");

    $("#detail-actors").text("Actors: " + actors);
  });

  show("detail");
}

// ---------------- CLICK MOVIE ----------------
$(document).on("click",".card",function(){
  let id = $(this).data("id");

  api(`/movie/${id}`).then(m=>{
    loadDetail(m);
  });
});

// ---------------- BACK ----------------
$(document).on("click","#back",function(){
  show("movies");
});

// ---------------- FAVORITES ----------------
$(document).on("click","#favBtn",function(){
  if(!currentMovie) return;

  let favs = JSON.parse(localStorage.getItem("favs") || "[]");

  if(!favs.some(f => f.id === currentMovie.id)){
    favs.push(currentMovie);
  }

  localStorage.setItem("favs", JSON.stringify(favs));
  alert("Added ❤️");
});

// ---------------- NAV ----------------
$(document).on("click","button[data-view]",function(){
  let v = $(this).data("view");
  show(v);

  if(v==="home") loadHome();
  if(v==="movies") loadMovies();
  if(v==="favorites") loadFavs();
});

// ---------------- SEARCH BUTTON (FIXED) ----------------
$("#searchBtn").on("click", function(){
  searchQuery = $("#search").val().trim();
  page = 1;
  reloadAll();
});

// ---------------- LIVE SUGGESTIONS ----------------
$("#search").on("input",function(){
  let q = $(this).val().trim();

  if(q.length < 2){
    $("#suggestions").empty();
    return;
  }

  api(`/search/movie?query=${q}`).then(d=>{
    let results = (d.results || []).slice(0,5);

    $("#suggestions").html(
      results.map(m=>`
        <div class="suggestion-item" data-id="${m.id}">
          ${m.title}
        </div>
      `).join("")
    );
  });
});

// ---------------- SUGGESTION CLICK ----------------
$(document).on("click",".suggestion-item",function(){
  let id = $(this).data("id");

  $("#suggestions").empty();
  $("#search").val("");

  api(`/movie/${id}`).then(m=>{
    loadDetail(m);
  });
});

// ---------------- CLOSE SUGGESTIONS ----------------
$(document).on("click",function(e){
  if(!$(e.target).closest("#search,#suggestions").length){
    $("#suggestions").empty();
  }
});

// ---------------- FILTERS (GLOBAL FIXED) ----------------
$("#sortFilter").on("change",function(){
  currentSort = $(this).val();
  page = 1;
  reloadAll();
});

$("#genreFilter").on("change",function(){
  currentGenre = $(this).val();
  page = 1;
  reloadAll();
});

// ---------------- PAGINATION ----------------
$("#next").on("click",function(){
  page++;
  loadMovies();
});

$("#prev").on("click",function(){
  if(page > 1){
    page--;
    loadMovies();
  }
});

// ---------------- GLOBAL RELOAD ENGINE ----------------
function reloadAll(){
  if($("#home-view").hasClass("active")) loadHome();
  if($("#movies-view").hasClass("active")) loadMovies();
  if($("#favorites-view").hasClass("active")) loadFavs();
}

// ---------------- INIT ----------------
$(function(){
  loadHome();
});

</script>

</body>
</html>
