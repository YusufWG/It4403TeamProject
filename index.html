<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CineVault</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<nav>
  <div class="logo">CINE<span>VAULT</span></div>

  <input id="search" placeholder="Search movies..." />

  <button data-view="home">Home</button>
  <button data-view="movies">Movies</button>
  <button data-view="favorites">Favorites</button>
</nav>

<div id="app">

  <div id="home-view" class="view active">
    <h1>Trending Movies</h1>
    <div id="home-grid"></div>
  </div>

  <div id="movies-view" class="view">
    <h1>Movies</h1>
    <div id="movies-grid"></div>
  </div>

  <div id="detail-view" class="view">
    <button id="back">← Back</button>
    <h1 id="detail-title"></h1>
    <p id="detail-overview"></p>
    <button id="favBtn">❤️ Favorite</button>
  </div>

  <div id="favorites-view" class="view">
    <h1>Favorites</h1>
    <div id="fav-grid"></div>
  </div>

</div>

<script>

const API_KEY = "ec49f2d5bd16d2cf6f6a55185e08503c";
const BASE = "https://api.themoviedb.org/3";
const IMG_PATH = "https://image.tmdb.org/t/p/w500";

let currentMovie = null;
let favorites = JSON.parse(localStorage.getItem("favs") || "[]");

// ---------- SPA ----------
function showView(v){
  $(".view").removeClass("active");
  $(`#${v}-view`).addClass("active");
}

// ---------- API ----------
function api(url){
  return $.get(`${BASE}${url}?api_key=${API_KEY}`)
    .fail(()=> alert("API Error"));
}

// ---------- HOME ----------
function loadHome(){
  api("/trending/movie/day").then(d=>{
    $("#home-grid").html(renderMovies(d.results));
  });
}

// ---------- MOVIES ----------
function loadMovies(){
  $("#movies-grid").html("Loading...");
  api("/discover/movie").then(d=>{
    $("#movies-grid").html(renderMovies(d.results));
  });
}

// ---------- FIXED RENDER (WITH IMAGES) ----------
function renderMovies(list){
  return list.map(m => `
    <div class="card" data-id="${m.id}">
      <img src="${m.poster_path ? IMG_PATH + m.poster_path : ''}" />
      <p>${m.title}</p>
    </div>
  `).join("");
}

// ---------- DETAIL ----------
$(document).on("click",".card",function(){
  let id = $(this).data("id");

  api(`/movie/${id}`).then(m=>{
    currentMovie = m;
    $("#detail-title").text(m.title);
    $("#detail-overview").text(m.overview);
    showView("detail");
  });
});

// ---------- FAVORITES ----------
$("#favBtn").on("click",function(){
  if(!currentMovie) return;

  favorites.push(currentMovie);
  localStorage.setItem("favs", JSON.stringify(favorites));

  alert("Added to favorites");
});

// ---------- LOAD FAVS ----------
function loadFavs(){
  $("#fav-grid").html(
    favorites.map(f => `
      <div class="card">
        <img src="${IMG_PATH + f.poster_path}" />
        <p>${f.title}</p>
      </div>
    `).join("")
  );
}

// ---------- SEARCH ----------
$("#search").on("keyup",function(){
  let q = $(this).val();
  if(q.length < 2) return;

  api(`/search/movie&query=${q}`).then(d=>{
    $("#movies-grid").html(renderMovies(d.results));
  });
});

// ---------- NAV ----------
$(document).on("click","button[data-view]",function(){
  let v = $(this).data("view");
  showView(v);

  if(v === "home") loadHome();
  if(v === "movies") loadMovies();
  if(v === "favorites") loadFavs();
});

// BACK
$("#back").on("click",()=> showView("movies"));

// INIT
$(function(){
  loadHome();
});

</script>

</body>
</html>
