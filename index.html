<option value="">Genres</option>
  </select>

  <select id="sortFilter">
    <option value="popular">Popular</option>
    <option value="top_rated">Top Rated</option>
    <option value="now_playing">Now Playing</option>
  </select>

  <button data-view="home">Home</button>
  <button data-view="movies">Movies</button>
  <button data-view="favorites">Favorites</button>
</nav>

<div id="app">

  <div id="home-view" class="view active">
    <h1>Trending</h1>
    <div id="home-grid"></div>
  </div>

  <div id="movies-view" class="view">
    <h1>Movies</h1>
    <div id="movies-grid"></div>

    <div class="pagination">
      <button id="prev">Prev</button>
      <span id="page">1</span>
      <button id="next">Next</button>
    </div>
  </div>

  <div id="detail-view" class="view">
    <button id="back">← Back</button>

    <div class="detail">
      <img id="detail-img" />
      <h2 id="detail-title"></h2>
      <p id="detail-overview"></p>
      <p id="detail-actors"></p>

      <button id="favBtn">Favorite</button>
    </div>
  </div>

  <div id="favorites-view" class="view">
    <h1>Favorites</h1>
    <div id="fav-grid"></div>
  </div>

</div>

<script>

const API_KEY = "ec49f2d5bd16d2cf6f6a55185e08503c";
const BASE = "https://api.themoviedb.org/3";
const IMG = "https://image.tmdb.org/t/p/w500";

let currentView = "home";
let currentMovie = null;
let page = 1;
let searchQuery = "";
let currentGenre = "";
let currentSort = "popular";

// ---------------- API ----------------
function api(url){
  return $.ajax({
    url: BASE + url,
    data: { api_key: API_KEY }
  });
}

// ---------------- VIEW ----------------
function show(view){
  $(".view").removeClass("active");
  $(`#${view}-view`).addClass("active");
  currentView = view;
}

// ---------------- GENRES ----------------
function loadGenres(){
  api("/genre/movie/list").then(d=>{
    let html = `<option value="">Genres</option>`;
    d.genres.forEach(g=>{
      html += `<option value="${g.id}">${g.name}</option>`;
    });
    $("#genreFilter").html(html);
  });
}

// ---------------- FAVORITES ----------------
function getFavs(){
  return JSON.parse(localStorage.getItem("favs") || "[]");
}

function saveFavs(favs){
  localStorage.setItem("favs", JSON.stringify(favs));
}

// ---------------- FILTER ----------------
function applyFilters(list){
  if(currentGenre){
    list = list.filter(m =>
      (m.genre_ids || []).includes(Number(currentGenre))
    );
  }
  return list;
}

// ---------------- RENDER ----------------
function render(list){
  return (list || []).map(m=>{
    let img = m.poster_path
      ? IMG + m.poster_path
      : "https://via.placeholder.com/300x450";

    return `
      <div class="card" data-id="${m.id}">
        <img src="${img}">
        <p>${m.title}</p>
      </div>
    `;
  }).join("");
}

// ---------------- LOAD HOME ----------------
function loadHome(){
  api(`/movie/${currentSort}`).then(d=>{
    $("#home-grid").html(render(applyFilters(d.results)));
  });
}

// ---------------- LOAD MOVIES ----------------
function loadMovies(){
  let url = searchQuery
    ? `/search/movie?query=${searchQuery}&page=${page}`
    : `/movie/${currentSort}?page=${page}`;

  api(url).then(d=>{
    $("#movies-grid").html(render(applyFilters(d.results)));
    $("#page").text(page);
  });
}

// ---------------- FAVORITES ----------------
function loadFavs(){
  let favs = getFavs();
  $("#fav-grid").html(render(applyFilters(favs)));
}

// ---------------- DETAIL ----------------
function loadDetail(m){
  currentMovie = m;

  show("detail");

  $("#detail-img").attr("src", IMG + m.poster_path);
  $("#detail-title").text(m.title);
  $("#detail-overview").text(m.overview);

  api(`/movie/${m.id}/credits`).then(d=>{
    $("#detail-actors").text(
      "Actors: " + d.cast.slice(0,5).map(a=>a.name).join(", ")
    );
  });

  updateFavBtn();
}

// ---------------- FAVORITE ----------------
function updateFavBtn(){
  let favs = getFavs();
  let exists = favs.some(f => f.id === currentMovie.id);

  $("#favBtn").text(exists ? "Remove Favorite" : "Add Favorite");
}

$("#favBtn").on("click",function(){
  let favs = getFavs();

  if(favs.some(f => f.id === currentMovie.id)){
    favs = favs.filter(f => f.id !== currentMovie.id);
  } else {
    favs.push(currentMovie);
  }

  saveFavs(favs);
  updateFavBtn();
  loadFavs();
});

// ---------------- CLICK CARD ----------------
$(document).on("click",".card",function(){
  let id = $(this).data("id");

  api(`/movie/${id}`).then(m=>{
    loadDetail(m);
  });
});

// ---------------- NAV ----------------
$(document).on("click","button[data-view]",function(){
  let v = $(this).data("view");
  show(v);

  if(v==="home") loadHome();
  if(v==="movies") loadMovies();
  if(v==="favorites") loadFavs();
});

// ---------------- SEARCH ----------------
$("#searchBtn").on("click",function(){
  searchQuery = $("#search").val();
  page = 1;
  show("movies");
  loadMovies();
});

// ---------------- LIVE SEARCH ----------------
$("#search").on("input",function(){
  let q = $(this).val();

  if(q.length < 2){
    $("#suggestions").empty();
    return;
  }

  api(`/search/movie?query=${q}`).then(d=>{
    $("#suggestions").html(
      d.results.slice(0,6).map(m=>`
        <div class="suggestion-item" data-id="${m.id}">
          ${m.title}
        </div>
      `).join("")
    );
  });
});

// suggestion click
$(document).on("click",".suggestion-item",function(){
  let id = $(this).data("id");

  $("#suggestions").empty();
  $("#search").val("");

  api(`/movie/${id}`).then(m=>{
    loadDetail(m);
  });
});

// close suggestions
$(document).on("click",function(e){
  if(!$(e.target).closest("#search,#suggestions").length){
    $("#suggestions").empty();
  }
});

// ---------------- FILTERS ----------------
$("#genreFilter").on("change",function(){
  currentGenre = $(this).val();
  loadHome();
  loadMovies();
  loadFavs();
});

$("#sortFilter").on("change",function(){
  currentSort = $(this).val();
  loadHome();
  loadMovies();
});

// ---------------- PAGINATION ----------------
$("#next").on("click",function(){
  page++;
  loadMovies();
});

$("#prev").on("click",function(){
  if(page>1){
    page--;
    loadMovies();
  }
});

// ---------------- INIT ----------------
$(function(){
  loadGenres();
  loadHome();
});

</script>

</body>
</html>
