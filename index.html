<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CineVault — Discover Movies & TV</title>

  <!-- jQuery -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<nav>
  <div class="logo">CINE<span>VAULT</span></div>
  <ul class="nav-links">
    <li><a data-view="home">Home</a></li>
    <li><a data-view="movies">Movies</a></li>
    <li><a data-view="tv">TV Shows</a></li>
    <li><a data-view="favorites">Favorites</a></li>
  </ul>
</nav>

<div id="app">

  <div id="home-view" class="view active">
    <h1 id="hero-title">Loading...</h1>
    <p id="hero-overview"></p>
  </div>

  <div id="movies-view" class="view">
    <div id="movies-grid"></div>
  </div>

  <div id="tv-view" class="view">
    <div id="tv-grid"></div>
  </div>

  <div id="detail-view" class="view">
    <h1 id="detail-title"></h1>
    <p id="detail-overview"></p>
  </div>

  <div id="favorites-view" class="view">
    <h2>Favorites</h2>
    <div id="favs-grid"></div>
  </div>

</div>

<!-- ================= JAVASCRIPT ================= -->
<script>

const API_KEY = "ec49f2d5bd16d2cf6f6a55185e08503c";
const BASE = "https://api.themoviedb.org/3";

const state = {
  favorites: JSON.parse(localStorage.getItem("favs") || "[]")
};

// VIEW SWITCH
function showView(name){
  $(".view").removeClass("active");
  $(`#${name}-view`).addClass("active");
}

// NAV
$(document).on("click","[data-view]",function(){
  const v = $(this).data("view");
  showView(v);

  if(v === "movies") loadMovies();
  if(v === "tv") loadTV();
  if(v === "favorites") renderFavs();
});

// API CALL
function tmdb(url){
  return $.get(`${BASE}${url}?api_key=${API_KEY}`);
}

// HOME
function loadHome(){
  tmdb("/trending/movie/day").then(d=>{
    const m = d.results[0];
    $("#hero-title").text(m.title);
    $("#hero-overview").text(m.overview);
  });
}

// MOVIES
function loadMovies(){
  $("#movies-grid").html("Loading...");
  tmdb("/discover/movie").then(d=>{
    $("#movies-grid").html(
      d.results.map(m =>
        `<div class="card" data-id="${m.id}" data-type="movie">${m.title}</div>`
      ).join("")
    );
  });
}

// TV
function loadTV(){
  $("#tv-grid").html("Loading...");
  tmdb("/discover/tv").then(d=>{
    $("#tv-grid").html(
      d.results.map(t =>
        `<div class="card" data-id="${t.id}" data-type="tv">${t.name}</div>`
      ).join("")
    );
  });
}

// DETAIL VIEW
$(document).on("click",".card",function(){
  const id = $(this).data("id");
  const type = $(this).data("type");

  tmdb(`/${type}/${id}`).then(d=>{
    $("#detail-title").text(d.title || d.name);
    $("#detail-overview").text(d.overview);
    showView("detail");
  });
});

// FAVORITES
function renderFavs(){
  $("#favs-grid").html(
    state.favorites.map(f => `<div class="card">${f.title}</div>`).join("")
  );
}

// INIT
$(function(){
  loadHome();
});

</script>

</body>
</html>
