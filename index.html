<div id="pagination">
      <button id="prev">Prev</button>
      <span id="page">1</span>
      <button id="next">Next</button>
    </div>
  </div>

  <div id="detail-view" class="view">
    <button id="back">← Back</button>

    <div class="detail-box">
      <img id="detail-img"/>
      <h1 id="detail-title"></h1>
      <p id="detail-overview"></p>
      <p id="detail-actors"></p>

      <button id="favBtn">Favorite</button>
    </div>
  </div>

  <div id="favorites-view" class="view">
    <h1>Favorites</h1>
    <div id="fav-grid"></div>
  </div>

</div>

<script>

const API_KEY = "ec49f2d5bd16d2cf6f6a55185e08503c";
const BASE = "https://api.themoviedb.org/3";
const IMG = "https://image.tmdb.org/t/p/w500";

let currentMovie = null;
let page = 1;
let currentGenre = "";
let currentSort = "popular";
let searchQuery = "";

// ---------------- API ----------------
function api(url){
  return $.ajax({
    url: BASE + url,
    data: { api_key: API_KEY }
  });
}

// ---------------- FAVORITES ----------------
function getFavs(){
  return JSON.parse(localStorage.getItem("favs") || "[]");
}

function saveFavs(favs){
  localStorage.setItem("favs", JSON.stringify(favs));
}

function isFavorite(id){
  return getFavs().some(f => f.id === id);
}

// ---------------- FILTER ----------------
function applyFilters(list){
  if(currentGenre){
    list = list.filter(m =>
      m.genre_ids?.includes(Number(currentGenre))
    );
  }
  return list;
}

// ---------------- RENDER ----------------
function render(list){
  return (list || []).map(m=>{
    const img = m.poster_path
      ? IMG + m.poster_path
      : "https://via.placeholder.com/300x450?text=No+Image";

    return `
      <div class="card" data-id="${m.id}">
        <img src="${img}">
        <p>${m.title}</p>
      </div>
    `;
  }).join("");
}

// ---------------- HOME (FIXED ENDPOINTS) ----------------
function loadHome(){
  api(`/movie/${currentSort}`).then(d=>{
    $("#home-grid").html(render(applyFilters(d.results || [])));
  });
}

// ---------------- MOVIES ----------------
function loadMovies(){
  $("#movies-grid").html("Loading...");

  let url = searchQuery
    ? `/search/movie?query=${searchQuery}&page=${page}`
    : `/movie/${currentSort}?page=${page}`;

  api(url).then(d=>{
    $("#movies-grid").html(render(applyFilters(d.results || [])));
    $("#page").text(page);
  });
}

// ---------------- FAVORITES (FIXED SAFE LOGIC) ----------------
function loadFavs(){
  let favs = getFavs();

  let list = applyFilters(favs);

  $("#fav-grid").html(render(list));
}

// ---------------- DETAIL ----------------
function loadDetail(movie){
  currentMovie = movie;

  $("#detail-img").attr(
    "src",
    movie.poster_path ? IMG + movie.poster_path : ""
  );

  $("#detail-title").text(movie.title);
  $("#detail-overview").text(movie.overview);

  api(`/movie/${movie.id}/credits`).then(c=>{
    $("#detail-actors").text(
      "Actors: " +
      (c.cast || []).slice(0,5).map(a=>a.name).join(", ")
    );
  });

  updateFavButton();

  $(".view").removeClass("active");
  $("#detail-view").addClass("active");
}

// ---------------- FAVORITE BUTTON ----------------
function updateFavButton(){
  if(!currentMovie) return;

  $("#favBtn").text(
    isFavorite(currentMovie.id)
      ? "Remove Favorite"
      : "Add Favorite"
  );
}

$("#favBtn").on("click",function(){
  let favs = getFavs();

  if(isFavorite(currentMovie.id)){
    favs = favs.filter(f => f.id !== currentMovie.id);
  } else {
    favs.push(currentMovie);
  }

  saveFavs(favs);
  updateFavButton();
  loadFavs();
});

// ---------------- CLICK MOVIE ----------------
$(document).on("click",".card",function(){
  let id = $(this).data("id");

  api(`/movie/${id}`).then(m=>{
    loadDetail(m);
  });
});

// ---------------- NAV ----------------
$(document).on("click","button[data-view]",function(){
  let v = $(this).data("view");

  $(".view").removeClass("active");
  $(`#${v}-view`).addClass("active");

  if(v==="home") loadHome();
  if(v==="movies") loadMovies();
  if(v==="favorites") loadFavs();
});

// ---------------- SEARCH ----------------
$("#searchBtn").on("click",function(){
  searchQuery = $("#search").val().trim();
  page = 1;
  loadMovies();
});

// ---------------- FILTERS (FIXED GLOBAL BEHAVIOR) ----------------
$("#genreFilter").on("change",function(){
  currentGenre = $(this).val();

  loadHome();
  loadMovies();
  loadFavs();
});

$("#sortFilter").on("change",function(){
  currentSort = $(this).val();

  loadHome();
  loadMovies();
});

// ---------------- PAGINATION ----------------
$("#next").on("click",function(){
  page++;
  loadMovies();
});

$("#prev").on("click",function(){
  if(page > 1){
    page--;
    loadMovies();
  }
});

// ---------------- INIT ----------------
$(function(){
  loadHome();
});

</script>

</body>
</html>

✔ Home filters NOW WORK
